<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Executive Team | Poster Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f7f3e9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}header{padding:20px 26px;border-bottom:1px solid #39343a}h1{font-size:21px;margin:0}small{color:#c8b78b}main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:24px;padding:24px;max-width:1200px;margin:auto}.panel{background:#1d1c22;padding:20px;border-radius:14px}label{display:block;margin:14px 0 5px;font-size:13px;color:#dfd2b8}input,textarea,select{width:100%;padding:11px;border:1px solid #514b52;border-radius:8px;background:#121216;color:white;font:inherit}textarea{min-height:65px}button{padding:12px 18px;background:#c5a568;color:#17120c;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:15px}.preview{text-align:center}canvas{width:min(100%,560px);height:auto;background:#17151b;box-shadow:0 12px 36px #0009}p{line-height:1.6;color:#cfc6b8;font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>AI Executive Team — Poster Studio</h1><small>日本語文字を正確に重ねるポスター制作・試作版</small></header><main><section class="panel"><label>背景画像（AIが生成した画像を選択）</label><input id="image" type="file" accept="image/*"><label>イベント名</label><textarea id="event">HALLOWEEN NIGHT</textarea><label>店名</label><input id="shop" value="CLUB MAISON"><label>開催日</label><input id="date" value="2026.10.31 SAT"><label>詳細・料金など</label><textarea id="details">SPECIAL EVENT</textarea><label>文字色</label><select id="color"><option value="#f5d69b">ゴールド</option><option value="#ffffff">ホワイト</option><option value="#151515">ブラック</option></select><button id="download">PNG画像を保存</button><p>入力した文字は画像生成AIに書かせず、ブラウザで正確に描画します。日本語も入力可能です。画像はこのブラウザ内で処理し、アップロードしません。</p></section><section class="panel preview"><canvas id="poster" width="1080" height="1350"></canvas><p>縦型 1080 × 1350 px ／ 文字が長い場合は自動で縮小</p></section></main><script>
const c=document.getElementById('poster'),ctx=c.getContext('2d'),bg=new Image();let loaded=false;const ids=['event','shop','date','details','color'];function fitText(text,y,maxSize,maxWidth){let size=maxSize;ctx.font=`700 ${size}px sans-serif`;while(ctx.measureText(text).width>maxWidth&&size>22){size-=2;ctx.font=`700 ${size}px sans-serif`}ctx.fillText(text,540,y)}function draw(){ctx.fillStyle='#17141a';ctx.fillRect(0,0,1080,1350);if(loaded){let s=Math.max(1080/bg.width,1350/bg.height),w=bg.width*s,h=bg.height*s;ctx.drawImage(bg,(1080-w)/2,(1350-h)/2,w,h)}let g=ctx.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#08070a99');g.addColorStop(.35,'#08070a22');g.addColorStop(.75,'#08070a66');g.addColorStop(1,'#08070add');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=16;ctx.fillStyle=document.getElementById('color').value;fitText(document.getElementById('shop').value,150,74,950);fitText(document.getElementById('event').value.replace(/\n/g,' '),600,105,950);fitText(document.getElementById('date').value,1010,66,940);fitText(document.getElementById('details').value.replace(/\n/g,' '),1130,54,950);ctx.shadowBlur=0}ids.forEach(id=>document.getElementById(id).addEventListener('input',draw));document.getElementById('image').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);bg.onload=()=>{loaded=true;draw();URL.revokeObjectURL(url)};bg.src=url});document.getElementById('download').addEventListener('click',()=>{draw();const a=document.createElement('a');a.download='event-poster.png';a.href=c.toDataURL('image/png');a.click()});draw();
</script></body></html>
